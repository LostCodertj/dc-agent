name: Android APK

on:
  push:
    paths: [ "android/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk DcAgent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DcAgent
          path: DcAgent.apk
      - name: Publish release (apk-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest DcAgent.apk --title "DC Agent v1.0.${{ github.run_number }}" --notes "Avtomatik yig'ilgan APK. Telefonga yuklab o'rnating." --latest
